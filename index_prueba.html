<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Prueba Git</title>

<body>

  <header>
    <h1>Prueba Git</h1>
  </header>

  <main>

    <section>
      <h2>Proyecto de reservas</h2>

      <p>
        Esta página se utilizará para realizar una prueba
        de trabajo colaborativo con Git y GitHub.
      </p>
    </section>

<main>

    <!-- AQUÍ PEGAS LA NUEVA SECCIÓN DE RESERVAS -->
    <section id="reservas-cerro">
      <h2>Reserva tu Visita al Cerro</h2>
      <p>Selecciona la fecha y la experiencia que deseas disfrutar en la naturaleza.</p>

      <form action="#" method="post">
        <div>
          <label for="tipo-reserva">Tipo de actividad:</label>
          <select id="tipo-reserva" name="tipo-reserva" required>
            <option value="" disabled selected>Elige una opción...</option>
            <option value="senderismo">Ruta de Senderismo Guiada</option>
            <option value="camping">Zona de Acampada</option>
            <option value="mirador">Acceso al Mirador y Merendero</option>
          </select>
        </div>

        <div>
          <label for="fecha">Fecha de reserva:</label>
          <input type="date" id="fecha" name="fecha" required>
        </div>

        <div>
          <label for="personas">Número de personas:</label>
          <input type="number" id="personas" name="personas" min="1" max="10" value="1" required>
        </div>

        <button type="submit">Confirmar Reserva</button>
      </form>
    </section>

</main>
